[project]
name = "clickhouse-tools"
version = "0.1.0"
description = "Comprehensive toolkit for managing multiple ClickHouse projects and environments"
authors = [
    { name = "Dan Young", email = "your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "clickhouse-connect>=0.7.0",
    "click>=8.1.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "keyring>=24.0.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
    "alembic>=1.13.0",
    "sqlparse>=0.4.0",
    "jinja2>=3.1.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "cryptography>=41.0.0",
]

[project.scripts]
ch = "ch:cli"
sync-users = "sync_users:sync_users"
compare-schemas = "compare_schemas:compare_schemas"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "types-PyYAML",
    "types-tabulate",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "*.py",
    "queries/**/*.sql",
    "README.md",
    "requirements.txt",
    "projects.yaml",
    ".env.template"
]

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "clickhouse_connect.*",
    "keyring.*",
]
ignore_missing_imports = true